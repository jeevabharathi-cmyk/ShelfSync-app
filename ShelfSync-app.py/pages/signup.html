<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ShelfSync</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-4);
        }

        .signup-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-2xl);
            padding: var(--space-10);
            width: 100%;
            max-width: 500px;
            box-shadow: var(--shadow-2xl);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .role-selector {
            display: flex;
            gap: var(--space-2);
            margin-bottom: var(--space-6);
            background: rgba(0, 0, 0, 0.05);
            padding: var(--space-1);
            border-radius: var(--radius-lg);
        }

        .role-option {
            flex: 1;
            text-align: center;
            padding: var(--space-2);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: var(--text-sm);
            font-weight: var(--font-bold);
            transition: all var(--transition-fast);
        }

        .role-option.active {
            background: white;
            color: var(--primary-color);
            box-shadow: var(--shadow-sm);
        }

        .form-group {
            margin-bottom: var(--space-4);
        }

        .form-label {
            display: block;
            font-size: var(--text-xs);
            font-weight: var(--font-bold);
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: var(--space-1);
        }

        .form-control {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            background: white;
            transition: all var(--transition-fast);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            outline: none;
        }
    </style>
</head>

<body>
    <div class="signup-card">
        <div style="text-align: center; margin-bottom: var(--space-8);">
            <h1 style="font-size: var(--text-3xl); margin-bottom: var(--space-2);">Create Account</h1>
            <p style="color: var(--text-muted);">Join the ShelfSync community today</p>
        </div>

        <div class="role-selector">
            <div class="role-option active">Customer</div>
            <div class="role-option">Seller</div>
            <div class="role-option">Delivery</div>
        </div>

        <form action="login-customer.html">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
                <div class="form-group">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control" placeholder="John" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control" placeholder="Doe" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div style="margin: var(--space-6) 0;">
                <label style="display: flex; align-items: flex-start; gap: var(--space-3); cursor: pointer;">
                    <input type="checkbox" required
                        style="margin-top: 4px; width: 18px; height: 18px; accent-color: var(--primary-color);">
                    <span style="font-size: var(--text-sm); color: var(--text-secondary);">
                        I agree to the <a href="#"
                            style="color: var(--primary-color); text-decoration: none; font-weight: var(--font-bold);">Terms
                            of Service</a> and <a href="#"
                            style="color: var(--primary-color); text-decoration: none; font-weight: var(--font-bold);">Privacy
                            Policy</a>.
                    </span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="padding: var(--space-4);">Create
                Account</button>
        </form>

        <div
            style="text-align: center; margin-top: var(--space-8); font-size: var(--text-sm); color: var(--text-muted);">
            Already have an account? <a href="login-customer.html"
                style="color: var(--primary-color); text-decoration: none; font-weight: var(--font-bold);">Login</a>
        </div>
    </div>

    <script>
        // Simple role switcher logic
        const options = document.querySelectorAll('.role-option');
        options.forEach(option => {
            option.addEventListener('click', () => {
                options.forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
            });
        });
    </script>
</body>

</html>
