<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ShelfSync</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-8) var(--space-4);
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-2xl);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: var(--space-10);
            width: 100%;
            max-width: 450px;
            animation: scaleIn var(--transition-slow) var(--ease-out);
        }

        .auth-header {
            text-align: center;
            margin-bottom: var(--space-8);
        }

        .auth-header h2 {
            color: var(--text-color);
            margin-bottom: var(--space-2);
        }

        .auth-header p {
            color: var(--text-light);
        }

        .role-switcher {
            display: flex;
            gap: var(--space-2);
            margin-bottom: var(--space-8);
            background: var(--background-color);
            padding: var(--space-1);
            border-radius: var(--radius-lg);
        }

        .role-switcher a {
            flex: 1;
            padding: var(--space-3);
            text-align: center;
            border-radius: var(--radius-md);
            font-weight: var(--font-medium);
            color: var(--text-secondary);
            transition: all var(--transition-base);
        }

        .role-switcher a.active {
            background: var(--secondary-color);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .form-footer {
            text-align: center;
            margin-top: var(--space-6);
            color: var(--text-secondary);
        }

        .form-footer a {
            color: var(--secondary-color);
            font-weight: var(--font-semibold);
        }

        .admin-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            padding: var(--space-1) var(--space-3);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: var(--font-bold);
            letter-spacing: var(--tracking-wider);
            margin-bottom: var(--space-4);
        }
    </style>
</head>

<body>
    <!-- Simple Navbar -->
    <nav class="navbar" style="background: rgba(255, 255, 255, 0.95);">
        <div class="container">
            <a href="../index.html" class="logo">
                <span>📚 ShelfSync</span>
            </a>
            <a href="../index.html" class="btn btn-ghost btn-sm">← Back to Home</a>
        </div>
    </nav>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="admin-badge">🔒 RESTRICTED ACCESS</span>
                <h2>⚡ Admin Portal</h2>
                <p>System administration access</p>
            </div>

            <!-- Role Switcher -->
            <div class="role-switcher">
                <a href="login-customer.html">Customer</a>
                <a href="login-seller.html">Seller</a>
                <a href="login-admin.html" class="active">Admin</a>
            </div>

            <!-- Login Form -->
            <form action="admin-dashboard.html">
                <div class="form-group">
                    <label class="form-label">Admin Username</label>
                    <input type="text" class="form-control" placeholder="admin" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="flex-between" style="margin-bottom: var(--space-6);">
                    <label style="display: flex; align-items: center; gap: var(--space-2); cursor: pointer;">
                        <input type="checkbox">
                        <span class="text-secondary">Remember me</span>
                    </label>
                    <a href="#" style="color: var(--secondary-color); font-size: var(--text-sm);">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-secondary btn-block btn-lg hover-lift">
                    Access Admin Panel
                </button>
            </form>

            <div class="form-footer">
                <p style="font-size: var(--text-xs); color: var(--text-muted);">
                    ⚠️ Unauthorized access is prohibited and monitored
                </p>
            </div>
        </div>
    </div>

</body>

</html>
