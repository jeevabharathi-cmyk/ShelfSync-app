<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Login - ShelfSync</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <style>
        body {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-8) var(--space-4);
        }

        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-2xl);
            box-shadow: var(--glass-shadow);
            padding: var(--space-10);
            width: 100%;
            max-width: 450px;
            animation: scaleIn var(--transition-slow) var(--ease-out);
        }

        .auth-header {
            text-align: center;
            margin-bottom: var(--space-8);
        }

        .auth-header h2 {
            color: var(--text-color);
            margin-bottom: var(--space-2);
        }

        .auth-header p {
            color: var(--text-light);
        }

        .role-switcher {
            display: flex;
            gap: var(--space-2);
            margin-bottom: var(--space-8);
            background: rgba(255, 255, 255, 0.5);
            padding: var(--space-1);
            border-radius: var(--radius-lg);
        }

        .role-switcher a {
            flex: 1;
            padding: var(--space-3);
            text-align: center;
            border-radius: var(--radius-md);
            font-weight: var(--font-medium);
            color: var(--text-secondary);
            transition: all var(--transition-base);
        }

        .role-switcher a.active {
            background: white;
            color: var(--accent-color);
            box-shadow: var(--shadow-sm);
        }

        .form-footer {
            text-align: center;
            margin-top: var(--space-6);
            color: var(--text-secondary);
        }

        .form-footer a {
            color: var(--accent-color);
            font-weight: var(--font-semibold);
        }
    </style>
</head>

<body>
    <!-- Simple Navbar -->
    <nav class="navbar" style="background: rgba(255, 255, 255, 0.95);">
        <div class="container">
            <a href="../index.html" class="logo">
                <span>📚 ShelfSync</span>
            </a>
            <a href="../index.html" class="btn btn-ghost btn-sm">← Back to Home</a>
        </div>
    </nav>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>🏪 Seller Portal</h2>
                <p>Manage your bookstore inventory</p>
            </div>

            <!-- Role Switcher -->
            <div class="role-switcher">
                <a href="login-customer.html">Customer</a>
                <a href="login-seller.html" class="active">Seller</a>
                <a href="login-admin.html">Admin</a>
            </div>

            <!-- Login Form -->
            <form action="seller-dashboard.html">
                <div class="form-group">
                    <label class="form-label">Seller Email</label>
                    <input type="email" class="form-control" placeholder="seller@bookstore.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="flex-between" style="margin-bottom: var(--space-6);">
                    <label style="display: flex; align-items: center; gap: var(--space-2); cursor: pointer;">
                        <input type="checkbox">
                        <span class="text-secondary">Remember me</span>
                    </label>
                    <a href="#" style="color: var(--accent-color); font-size: var(--text-sm);">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-accent btn-block btn-lg hover-lift">
                    Access Dashboard
                </button>
            </form>

            <div class="form-footer">
                <p>New seller? <a href="signup.html">Register your store</a></p>
            </div>
        </div>
    </div>

</body>

</html>
