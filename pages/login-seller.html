<!-- Login Form -->
<div class="container">
    <div class="card auth-container">
        <div class="text-center" style="margin-bottom: var(--spacing-lg);">
            <h2>Seller Portal</h2>
            <p class="text-light">Manage your inventory and sales</p>
        </div>

        <div class="role-switcher">
            <a href="login-customer.html">Customer</a>
            <a href="login-seller.html" class="active">Seller</a>
            <a href="login-admin.html">Admin</a>
        </div>

        <form action="seller-dashboard.html"> <!-- Redirect to Seller Dashboard -->
            <div class="form-group">
                <label class="form-label">Seller ID / Email</label>
                <input type="email" class="form-control" placeholder="store@example.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" style="background-color: var(--accent-color);">Login
                to Dashboard</button>
        </form>

        <div class="auth-links">
            <p>Want to sell with us? <a href="signup.html">Register as a Seller</a></p>
        </div>
    </div>
</div>
