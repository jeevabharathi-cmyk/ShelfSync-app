<!-- Sign Up Form -->
<div class="container">
    <div class="card auth-container">
        <div class="text-center" style="margin-bottom: var(--spacing-lg);">
            <h2>Create Account</h2>
            <p class="text-light">Join ShelfSync today</p>
        </div>

        <form action="login-customer.html">
            <div class="grid-2"
                style="gap: var(--spacing-md); grid-template-columns: 1fr 1fr; margin-bottom: var(--spacing-md);">
                <div>
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control" placeholder="John" required>
                </div>
                <div>
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control" placeholder="Doe" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" placeholder="john@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">I am a...</label>
                <select class="form-control">
                    <option value="customer">Customer (I want to buy books)</option>
                    <option value="seller">Seller (I want to sell books)</option>
                    <option value="delivery">Delivery Partner</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Create a strong password" required>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control" placeholder="Confirm password" required>
            </div>

            <div class="form-group" style="font-size: var(--small-size);">
                <label style="display: flex; align-items: start; gap: 0.5rem;">
                    <input type="checkbox" required style="margin-top: 0.25rem;">
                    <span>I agree to the <a href="#" style="color: var(--primary-color);">Terms of Service</a> and
                        <a href="#" style="color: var(--primary-color);">Privacy Policy</a>.</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>

        <div class="auth-links">
            <p>Already have an account? <a href="login-customer.html">Login</a></p>
        </div>
    </div>
</div>
